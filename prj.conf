# Core
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_LOG=n
CONFIG_PRINTK=y

# Sensors on emulated I2C bus
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_F75303=y
CONFIG_BMI160=y
CONFIG_AKM09918C=y

# UART shell (command interface) + CRC helpers
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="node:~$ "
CONFIG_CRC=y

# Watchdog-style health supervision uses a k_work_delayable
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
